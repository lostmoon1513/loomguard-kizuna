<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoomGuard: pre-publication brand review</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--muted:#5b6270;--line:#e2e5ea;--brand:#1f4fd8;--brand-ink:#fff;
--high-bg:#fde8e8;--high-ink:#8a1c1c;--med-bg:#fff1d6;--med-ink:#7a4b00;--low-bg:#e5eefc;--low-ink:#1c3f8a;
--ok-bg:#dff5e8;--ok-ink:#14532d;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--ink:#e8eaef;--muted:#9aa3b2;--line:#2a2f3a;--brand:#6b8cff;--brand-ink:#0b1020;
--high-bg:#3a1a1a;--high-ink:#ffb4b4;--med-bg:#3a2c10;--med-ink:#ffd48a;--low-bg:#17284a;--low-ink:#a9c4ff;--ok-bg:#12331f;--ok-ink:#9be2b5}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1240px;margin:auto;padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}.logo span{color:var(--brand)}
nav{display:flex;gap:4px;flex:1}nav a{padding:6px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:600}
nav a.on{background:var(--low-bg);color:var(--low-ink)}nav a:hover{color:var(--ink)}
.who{display:flex;gap:8px;align-items:center}.who select,.who input{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.who input{width:120px}
main{max-width:1240px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}p.sub{color:var(--muted);margin:0 0 16px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:900px){.grid,.studio{grid-template-columns:1fr!important}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}
label{display:block;font-weight:600;margin:10px 0 4px}
input[type=text],textarea,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
textarea{min-height:150px;resize:vertical}
button,.btn{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:hover:not(:disabled){border-color:var(--brand)}button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
button.danger{background:var(--high-bg);color:var(--high-ink);border-color:var(--high-bg)}
button.ok{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-bg)}
button.small{padding:4px 10px;font-size:13px}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--low-bg);color:var(--low-ink);white-space:nowrap}
.chip.high{background:var(--high-bg);color:var(--high-ink)}.chip.medium{background:var(--med-bg);color:var(--med-ink)}
.chip.ok{background:var(--ok-bg);color:var(--ok-ink)}.chip.plain{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.banner{padding:10px 14px;border-radius:10px;margin-bottom:14px;background:var(--med-bg);color:var(--med-ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.info{background:var(--low-bg);color:var(--low-ink)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:13px}
tr.link{cursor:pointer}tr.link:hover{background:var(--bg)}
.studio{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.doc{white-space:pre-wrap;line-height:1.8;font-size:16px}
mark{padding:1px 2px;border-radius:4px;cursor:pointer;color:inherit}
mark.high{background:var(--high-bg);box-shadow:inset 0 -2px 0 var(--high-ink)}mark.medium{background:var(--med-bg);box-shadow:inset 0 -2px 0 var(--med-ink)}
mark.low{background:var(--low-bg);box-shadow:inset 0 -2px 0 var(--low-ink)}mark.exc{outline:2px dashed var(--muted)}
mark.flash,.issue.flash{outline:3px solid var(--brand)}
.issue{border:1px solid var(--line);border-left-width:5px;border-radius:10px;padding:12px;background:var(--card)}
.issue.high{border-left-color:var(--high-ink)}.issue.medium{border-left-color:var(--med-ink)}.issue.low{border-left-color:var(--low-ink)}
.issue .q{font-weight:700;margin:6px 0 2px;overflow-wrap:anywhere}.issue .why{color:var(--muted);margin:4px 0}
.cite{font-size:13px;margin:6px 0}.cite b{font-weight:700}
.bars .b{display:flex;gap:8px;align-items:center;margin:6px 0}.bars .n{width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .t{flex:1;background:var(--bg);border-radius:6px;height:14px}.bars .f{background:var(--brand);height:14px;border-radius:6px}
.comment{border-top:1px solid var(--line);padding:8px 0}.comment small{color:var(--muted)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:9;display:flex;flex-direction:column;gap:8px;max-width:90vw}
.t{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow)}.t.err{background:var(--high-ink);color:#fff}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}.muted{color:var(--muted)}.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="#/">Loom<span>Guard</span></a>
  <nav id="nav"></nav>
  <div class="who"><label class="sr" for="role">Role</label>
    <select id="role"><option value="creator">Creator</option><option value="manager">Manager</option></select>
    <label class="sr" for="user">Your name</label><input id="user" type="text" placeholder="Your name" maxlength="30"></div>
</div></header>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const API = new URLSearchParams(location.search).get('api') || '';
const S = {role: localStorage.getItem('lg_role') || 'creator', user: localStorage.getItem('lg_user') || '', brand: null, draft: null};
const $ = s => document.querySelector(s);

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (['disabled', 'value', 'checked'].includes(k)) el[k] = v;
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) { if (kid == null || kid === false) continue; el.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
  return el;
}   // text is always added as text nodes, never as HTML: drafts are untrusted

async function api(path, opts = {}) {
  const headers = {'X-Role': S.role, 'X-User': (S.user || S.role).replace(/[^\x20-\x7E]/g, '')};
  let body = opts.body;
  if (body && !(body instanceof FormData)) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(body); }
  let res;
  try { res = await fetch(API + path, {method: opts.method || 'GET', headers, body}); }
  catch (e) { throw Object.assign(new Error('Cannot reach the server. If it just woke up, wait 30 seconds and try again.'), {code: 'NETWORK'}); }
  let data = null; try { data = await res.json(); } catch (e) {}
  if (!res.ok) { const er = (data && data.error) || {code: 'HTTP_' + res.status, message: res.statusText}; throw Object.assign(new Error(er.message), {code: er.code}); }
  return data;
}
function toast(msg, err) { const t = h('div', {class: 't' + (err ? ' err' : '')}, msg); $('#toast').append(t); setTimeout(() => t.remove(), err ? 7000 : 3500); }
async function guard(fn, btn) {
  const old = btn && btn.textContent; if (btn) { btn.disabled = true; btn.replaceChildren(h('span', {class: 'spin'}), 'Working...'); }
  try { return await fn(); } catch (e) { toast(e.message, true); } finally { if (btn) { btn.disabled = false; btn.textContent = old; } }
}
const STATUS = {DRAFT: 'Draft', IN_REVIEW: 'In review', APPROVED: 'Approved', CHANGES_REQUESTED: 'Changes requested'};
const statusChip = s => h('span', {class: 'chip ' + (s === 'APPROVED' ? 'ok' : s === 'CHANGES_REQUESTED' ? 'high' : s === 'IN_REVIEW' ? 'medium' : '')}, STATUS[s] || s);
const isAI = i => i.source.includes('gemini');

/* ---------- shell ---------- */
function renderNav() {
  const cur = location.hash.split('/')[1] || '';
  $('#nav').replaceChildren(...[['', 'Review'], ['brand', 'Brand kit'], ['insights', 'Insights']].map(([p, l]) =>
    h('a', {href: '#/' + p, class: (cur === p || (p === '' && cur === 'draft')) ? 'on' : ''}, l)));
}
$('#role').value = S.role; $('#user').value = S.user;
$('#role').onchange = e => { S.role = e.target.value; localStorage.setItem('lg_role', S.role); route(); };
$('#user').onchange = e => { S.user = e.target.value.trim(); localStorage.setItem('lg_user', S.user); };
window.addEventListener('hashchange', route);

async function loadBrand() { try { S.brand = await api('/api/brand'); } catch (e) { S.brand = null; } }
async function route() {
  renderNav();
  const [, page, id] = location.hash.split('/');
  const app = $('#app'); app.replaceChildren(h('p', {class: 'muted'}, h('span', {class: 'spin'}), 'Loading...'));
  try {
    await loadBrand();
    const view = page === 'brand' ? await brandView() : page === 'insights' ? await insightsView() : page === 'draft' ? await draftView(id) : await homeView();
    app.replaceChildren(view);
  } catch (e) { app.replaceChildren(h('div', {class: 'banner'}, e.message)); }
}

function kitBanner() {
  if (S.brand && S.brand.ready) return null;
  return h('div', {class: 'banner'}, 'No brand kit loaded yet. ',
    h('button', {class: 'small primary', onclick: async ev => { await guard(async () => { await api('/api/brand/load-demo', {method: 'POST'}); toast('Demo kit loaded'); route(); }, ev.target); }}, 'Load demo kit'),
    h('a', {href: '#/brand'}, 'or upload your own'));
}

/* ---------- home ---------- */
async function homeView() {
  const [list, samples] = await Promise.all([api('/api/drafts'), api('/api/demo/drafts').catch(() => ({}))]);
  const ta = h('textarea', {id: 'txt', placeholder: 'Paste your draft here, or choose a file below...'});
  const title = h('input', {type: 'text', id: 'ttl', placeholder: 'Title (optional)'});
  const file = h('input', {type: 'file', id: 'fl', accept: '.md,.txt,.docx,.pdf'});
  const sel = h('select', {id: 'smp', 'aria-label': 'Sample draft', onchange: e => { if (e.target.value) { ta.value = samples[e.target.value]; title.value = e.target.value; } }},
    h('option', {value: ''}, 'Try a sample draft...'), Object.keys(samples).map(k => h('option', {value: k}, k.replace('_', ' '))));
  const go = h('button', {class: 'primary', onclick: ev => guard(async () => {
    const fd = new FormData();
    if (file.files[0]) fd.append('file', file.files[0]); else if (ta.value.trim()) fd.append('text', ta.value); else { toast('Paste text or choose a file first', true); return; }
    fd.append('title', title.value); fd.append('author', S.user || S.role);
    const d = await api('/api/drafts', {method: 'POST', body: fd});
    location.hash = '#/draft/' + d.id;
  }, ev.target)}, 'Check draft');
  const rows = list.length ? list.map(d => h('tr', {class: 'link', tabindex: 0, onclick: () => location.hash = '#/draft/' + d.id, onkeydown: e => e.key === 'Enter' && (location.hash = '#/draft/' + d.id)},
    h('td', null, d.title), h('td', null, statusChip(d.status)), h('td', null, `${d.open_issues} open / ${d.total_issues}`), h('td', {class: 'muted'}, (d.updated_at || '').slice(0, 16).replace('T', ' ')))) :
    [h('tr', null, h('td', {colspan: 4, class: 'muted'}, 'No drafts yet. Check one on the left.'))];
  const queue = S.role === 'manager' ? list.filter(d => d.status === 'IN_REVIEW').length : 0;
  return h('div', null, kitBanner(),
    h('h1', null, 'Check content before it is published'),
    h('p', {class: 'sub'}, 'LoomGuard compares a draft with your brand guide and approved facts, explains each issue, and sends it to a manager for the final decision. It never approves anything itself.'),
    S.role === 'manager' && queue ? h('div', {class: 'banner info'}, `${queue} draft(s) waiting for your review.`) : null,
    h('div', {class: 'grid'},
      h('div', {class: 'card'}, h('h2', null, '1. Check a draft'), sel, h('label', {for: 'ttl'}, 'Title'), title, h('label', {for: 'txt'}, 'Draft text'), ta,
        h('label', {for: 'fl'}, 'Or upload a file (.md, .txt, .docx, text PDF)'), file, h('div', {class: 'row', style: 'margin-top:12px'}, go)),
      h('div', {class: 'card'}, h('h2', null, '2. Drafts'), h('table', null, h('thead', null, h('tr', null, ['Title', 'Status', 'Issues', 'Updated'].map(x => h('th', null, x)))), h('tbody', null, rows)))));
}

/* ---------- studio ---------- */
const editable = d => ['DRAFT', 'CHANGES_REQUESTED'].includes(d.status) && S.role === 'creator';
function docView(d) {
  const box = h('div', {class: 'doc', id: 'doc'}); let cur = 0;
  [...d.issues].sort((a, b) => a.start - b.start).forEach(i => {
    if (i.start < cur) return;                       // overlapping issue: still listed on the right
    box.append(d.text.slice(cur, i.start));
    box.append(h('mark', {class: i.severity + (i.status === 'exception_requested' ? ' exc' : ''), 'data-i': i.id, tabindex: 0, title: i.reason,
      onclick: () => focusCard(i.id), onkeydown: e => e.key === 'Enter' && focusCard(i.id)}, d.text.slice(i.start, i.end)));
    cur = i.end;
  });
  box.append(d.text.slice(cur)); return box;
}
function flash(el) { el.classList.add('flash'); el.scrollIntoView({behavior: 'smooth', block: 'center'}); setTimeout(() => el.classList.remove('flash'), 1600); }
const focusCard = id => { const el = document.querySelector(`[data-card="${id}"]`); el && flash(el); };

function issueCard(d, i) {
  const can = editable(d) && ['open', 'exception_requested'].includes(i.status);
  const act = (body, label) => ev => guard(async () => { S.draft = await api(`/api/drafts/${d.id}/issues/${i.id}`, {method: 'PATCH', body}); toast(label); studioRefresh(); }, ev.target);
  const edit = h('input', {type: 'text', value: i.quote, 'aria-label': 'Your replacement text', maxlength: 300});
  const note = h('textarea', {style: 'min-height:60px', placeholder: 'Why should this be allowed? (required)', 'aria-label': 'Exception reason'});
  const editBox = h('div', {class: 'row', hidden: true, style: 'margin-top:8px'}, edit, h('button', {class: 'small primary', onclick: act({action: 'edit', new_text: edit.value === i.quote ? '' : null}, 'Edit applied')}, 'Apply'));
  editBox.lastChild.onclick = ev => guard(async () => { S.draft = await api(`/api/drafts/${d.id}/issues/${i.id}`, {method: 'PATCH', body: {action: 'edit', new_text: edit.value}}); toast('Edit applied'); studioRefresh(); }, ev.target);
  const excBox = h('div', {hidden: true, style: 'margin-top:8px'}, note, h('button', {class: 'small', style: 'margin-top:6px', onclick: ev => guard(async () => {
    S.draft = await api(`/api/drafts/${d.id}/issues/${i.id}`, {method: 'PATCH', body: {action: 'request_exception', note: note.value}}); toast('Exception requested'); studioRefresh(); }, ev.target)}, 'Send request'));
  const toggle = box => () => { box.hidden = !box.hidden; };
  const cit = i.citation ? h('div', {class: 'cite'}, h('b', null, 'Source: '), `${i.citation.doc} · ${i.citation.ref}`, i.citation.rule_id ? ` (${i.citation.rule_id})` : '') : null;
  return h('div', {class: 'issue ' + i.severity, 'data-card': i.id, tabindex: -1},
    h('div', {class: 'row'}, h('span', {class: 'chip ' + i.severity}, i.severity.toUpperCase()), h('span', {class: 'chip'}, i.category),
      i.claim_status ? h('span', {class: 'chip plain'}, i.claim_status) : null, h('span', {class: 'chip plain', title: isAI(i) ? 'Found with AI help' : 'Found by a fixed rule'}, isAI(i) ? 'AI' : 'Rule'),
      h('span', {class: 'chip plain'}, i.priority), i.needs_review ? h('span', {class: 'chip medium'}, 'Needs human review') : null,
      i.status === 'exception_requested' ? h('span', {class: 'chip ok'}, 'Exception requested') : null),
    h('div', {class: 'q', onclick: () => { const m = document.querySelector(`mark[data-i="${i.id}"]`); m && flash(m); }, style: 'cursor:pointer'}, '"' + i.quote + '"'),
    h('div', {class: 'why'}, i.reason), cit,
    i.exception_note ? h('div', {class: 'why'}, 'Exception note: ' + i.exception_note) : null,
    can ? h('div', null,
      i.suggested_fixes.length ? h('div', {class: 'row'}, i.suggested_fixes.map(f => h('button', {class: 'small ok', onclick: act({action: 'accept', chosen_fix: f}, 'Fix applied')}, 'Use: ' + f))) : null,
      h('div', {class: 'row', style: 'margin-top:8px'}, h('button', {class: 'small', onclick: toggle(editBox)}, 'Edit manually'),
        i.status === 'open' ? h('button', {class: 'small', onclick: toggle(excBox)}, 'Request exception') : null), editBox, excBox) : null);
}

async function draftView(id) { S.draft = await api('/api/drafts/' + id); return studioNode(); }
function studioRefresh() { $('#app').replaceChildren(studioNode()); }
function studioNode() {
  const d = S.draft; const open = d.issues.filter(i => i.status === 'open').length;
  const cmt = h('textarea', {style: 'min-height:70px', placeholder: S.role === 'manager' ? 'Comment or reason for your decision' : 'Add a comment', 'aria-label': 'Comment'});
  const sendC = h('button', {class: 'small', onclick: ev => guard(async () => { if (!cmt.value.trim()) return; S.draft = await api(`/api/drafts/${d.id}/comments`, {method: 'POST', body: {text: cmt.value}}); studioRefresh(); }, ev.target)}, 'Add comment');
  const decide = decision => ev => guard(async () => { await api(`/api/drafts/${d.id}/decision`, {method: 'POST', body: {decision, comment: cmt.value}}); S.draft = await api('/api/drafts/' + d.id); toast(decision === 'approve' ? 'Approved' : 'Changes requested'); studioRefresh(); }, ev.target);
  const actions = [];
  if (S.role === 'creator' && ['DRAFT', 'CHANGES_REQUESTED'].includes(d.status)) {
    actions.push(h('button', {onclick: ev => guard(async () => { S.draft = await api(`/api/drafts/${d.id}/recheck`, {method: 'POST'}); toast('Checked again'); studioRefresh(); }, ev.target)}, 'Re-check'));
    actions.push(h('button', {class: 'primary', onclick: ev => guard(async () => { await api(`/api/drafts/${d.id}/submit`, {method: 'POST'}); S.draft = await api('/api/drafts/' + d.id); toast('Submitted for review'); studioRefresh(); }, ev.target)}, 'Submit for review'));
  }
  if (S.role === 'manager' && d.status === 'IN_REVIEW') {
    actions.push(h('button', {class: 'ok', onclick: decide('approve')}, 'Approve'), h('button', {class: 'danger', onclick: decide('request_changes')}, 'Request changes'));
  }
  const resolved = d.resolved || [];
  return h('div', null,
    h('div', {class: 'row', style: 'margin-bottom:12px'}, h('a', {href: '#/'}, '< All drafts'), h('h1', {class: 'grow', style: 'margin:0'}, d.title), statusChip(d.status), ...actions),
    !d.ai_available ? h('div', {class: 'banner'}, 'AI checks are unavailable right now, so only rule-based checks ran (terms, claims against approved facts, readability, injection scan). Tone and extra-claim review needs AI.') : null,
    S.role === 'manager' && d.status === 'IN_REVIEW' ? h('div', {class: 'banner info'}, 'You are the reviewer. Read the issues and exception notes, then approve or request changes. A reason is required to request changes.') : null,
    S.role === 'manager' && d.status !== 'IN_REVIEW' ? h('div', {class: 'banner info'}, 'Read-only: managers decide only on drafts that are in review.') : null,
    h('div', {class: 'studio'},
      h('div', {class: 'stack'}, h('div', {class: 'card'}, h('h2', null, 'Draft'), docView(d)),
        h('div', {class: 'card'}, h('h2', null, `Comments (${d.comments.length})`),
          d.comments.map(c => h('div', {class: 'comment'}, h('small', null, `${c.author} (${c.role})`), h('div', null, c.text))), cmt, h('div', {style: 'margin-top:6px'}, sendC))),
      h('div', {class: 'stack'},
        h('div', {class: 'card'}, h('h2', null, `Issues: ${open} open, ${d.issues.length} total`),
          d.issues.length ? h('div', {class: 'stack'}, d.issues.map(i => issueCard(d, i))) : h('div', {class: 'banner info', style: 'margin:0'}, 'No issues found. This draft matches the brand kit.')),
        resolved.length ? h('div', {class: 'card'}, h('h2', null, `Resolved (${resolved.length})`),
          resolved.map(r => h('div', {class: 'comment'}, h('span', {class: 'chip ok'}, r.status), ' ', h('s', null, r.quote), ' → ', h('b', null, r.replacement)))) : null)));
}

/* ---------- brand ---------- */
async function brandView() {
  const b = S.brand, g = h('input', {type: 'file', accept: '.pdf', id: 'g'}), f = h('input', {type: 'file', accept: '.csv', id: 'f'});
  return h('div', null, h('h1', null, 'Brand kit'), h('p', {class: 'sub'}, 'The guide and approved facts every draft is checked against.'),
    h('div', {class: 'grid'},
      h('div', {class: 'card'}, h('h2', null, 'Current kit'),
        b && b.ready ? h('div', {class: 'stack'},
          h('div', null, h('b', null, 'Version '), b.kit_version),
          h('div', null, h('b', null, 'Guide: '), `${b.guide.file}, ${b.guide.pages} pages, ${b.guide.chunks} rules (${b.guide.mandatory} mandatory, ${b.guide.with_exceptions} with exceptions)`),
          h('div', null, h('b', null, 'Approved facts: '), `${b.facts.file}, ${b.facts.rows} rows`),
          h('div', null, h('b', null, 'Terms: '), `${b.terms.banned} banned, ${b.terms.preferred} preferred, ${b.terms.hex_codes} colours`),
          h('div', null, h('b', null, 'Search: '), b.retrieval_mode === 'hybrid' ? 'hybrid (keyword + AI embeddings)' : 'keyword only (AI embeddings unavailable)')) :
          h('p', {class: 'muted'}, 'No kit loaded.'),
        h('div', {style: 'margin-top:12px'}, h('button', {onclick: ev => guard(async () => { await api('/api/brand/load-demo', {method: 'POST'}); toast('Demo kit loaded'); route(); }, ev.target)}, 'Load demo kit'))),
      h('div', {class: 'card'}, h('h2', null, 'Upload your own'), h('label', {for: 'g'}, 'Brand guide (text PDF)'), g, h('label', {for: 'f'}, 'Approved facts (CSV: id, claim, value, unit, source, valid_until)'), f,
        h('div', {style: 'margin-top:12px'}, h('button', {class: 'primary', onclick: ev => guard(async () => {
          if (!g.files[0] || !f.files[0]) { toast('Choose both files', true); return; }
          const fd = new FormData(); fd.append('guide', g.files[0]); fd.append('facts', f.files[0]);
          await api('/api/brand/upload', {method: 'POST', body: fd}); toast('Brand kit updated'); route(); }, ev.target)}, 'Upload kit')))));
}

/* ---------- insights ---------- */
function bars(title, obj) {
  const rows = Object.entries(obj || {}), max = Math.max(1, ...rows.map(r => r[1]));
  return h('div', {class: 'card'}, h('h2', null, title), rows.length ? h('div', {class: 'bars'}, rows.sort((a, b) => b[1] - a[1]).map(([k, v]) =>
    h('div', {class: 'b'}, h('div', {class: 'n', title: k}, k), h('div', {class: 't'}, h('div', {class: 'f', style: `width:${v / max * 100}%`})), h('b', null, v)))) : h('p', {class: 'muted'}, 'No data yet. Check a draft first.'));
}
async function insightsView() {
  const x = await api('/api/insights');
  return h('div', null, h('h1', null, 'Governance insights'), h('p', {class: 'sub'}, `${x.drafts} drafts checked, ${x.exceptions_requested} exception requests. Repeated mistakes show where creators need help, and repeated exceptions show where a rule may be unclear.`),
    h('div', {class: 'grid'}, bars('Issues by category', x.by_category), bars('Claim problems', x.by_claim_status), bars('Drafts by status', x.drafts_by_status),
      bars('Most triggered rules', Object.fromEntries((x.top_rules || []).map(r => [r.rule, r.count]))),
      h('div', {class: 'card'}, h('h2', null, 'Potentially unclear rules'), (x.potentially_unclear_rules || []).length ?
        h('ul', null, x.potentially_unclear_rules.map(r => h('li', null, `${r.rule}: ${r.exceptions_requested} exception requests`))) :
        h('p', {class: 'muted'}, 'None yet. A rule appears here when two or more creators ask for an exception to it.'))));
}
route();
</script>
</body>
</html>
